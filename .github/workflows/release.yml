name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native Linux musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install pinned toolchain and target
        run: |
          rustup show
          rustup target add "$RELEASE_TARGET"
          rustup component add rustfmt clippy
      - name: Verify application
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Verify real timeout
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --locked --features test-support --test pty -- --slow
      - name: Build production executable
        run: |
          cargo build --locked --release --no-default-features --bin monkeytype-tui --target "$RELEASE_TARGET"
          "target/$RELEASE_TARGET/release/monkeytype-tui" --version
          "target/$RELEASE_TARGET/release/monkeytype-tui" --help
      - name: Package executable and notices
        run: |
          cargo metadata --locked --format-version 1 --filter-platform "$RELEASE_TARGET" > target/release-metadata.json
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/package-release.py --binary "target/$RELEASE_TARGET/release/monkeytype-tui" --target "$RELEASE_TARGET" --metadata target/release-metadata.json --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/package-release.py --binary "target/$RELEASE_TARGET/release/monkeytype-tui" --target "$RELEASE_TARGET" --metadata target/release-metadata.json
          fi
      - name: Verify package installation
        run: |
          python3 tests/packaging.py
          python3 tests/packaging.py --archive target/packages/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Create draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "monkeytype-tui $RELEASE_TAG" packages/*.tar.gz packages/*.sha256
